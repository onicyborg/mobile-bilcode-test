name: Build Android demo APK
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Check API configuration
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: test -n "$API_BASE_URL" && [[ "$API_BASE_URL" == https://* ]]
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          [[ "$API_BASE_URL" == https://* ]]
          flutter build apk --debug --target-platform android-arm64 --dart-define="API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: siklus-android-demo-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
