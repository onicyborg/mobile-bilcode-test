publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  dio: ^5.11.1
  provider: ^6.1.5+1
